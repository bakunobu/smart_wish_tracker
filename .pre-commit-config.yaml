# Pre-commit configuration for Smart Wish Tracker
# See https://pre-commit.com for more information
repos:
  # Built-in pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: Remove trailing whitespace
      - id: end-of-file-fixer
        description: Ensure files end with a newline
      - id: check-yaml
        description: Check YAML files for parseable syntax
      - id: check-json
        description: Check JSON files for parseable syntax
      - id: check-toml
        description: Check TOML files for parseable syntax
      - id: check-added-large-files
        description: Prevent giant files from being committed
        args: ['--maxkb=1000']
      - id: check-case-conflict
        description: Check for files with names that would conflict on case-insensitive filesystems
      - id: check-merge-conflict
        description: Check for files that contain merge conflict strings
      - id: debug-statements
        description: Check for debugger imports and py37+ `breakpoint()` calls in python source
      - id: check-executables-have-shebangs
        description: Ensure that (non-binary) executables have a shebang
      - id: check-shebang-scripts-are-executable
        description: Ensure that (non-binary) files with a shebang are executable

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        description: Format Python code with Black
        language_version: python3
        args: ['--line-length=88']

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        description: Sort Python imports
        args: ['--profile=black', '--line-length=88']

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        description: Lint Python code with flake8
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions
        args: ['--max-line-length=88', '--extend-ignore=E203,W503']

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        description: Static type checking with mypy
        additional_dependencies: [types-all]
        args: ['--ignore-missing-imports', '--no-strict-optional']

  # Security linting with bandit
  - repo: https://github.com/pycqa/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        description: Security linting with bandit
        args: ['-r', '.', '-f', 'json', '-o', 'bandit-report.json']
        files: '\.py$'
        exclude: '^tests/.*$'

  # Documentation linting
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        description: Check docstring style
        args: ['--convention=google']

  # Additional Python checks
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        description: Upgrade Python syntax for newer versions
        args: ['--py38-plus']

  # Check for common Python mistakes
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        description: Remove unused imports and variables
        args: ['--in-place', '--remove-all-unused-imports', '--remove-unused-variables']

# Configuration for the entire pre-commit setup
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false