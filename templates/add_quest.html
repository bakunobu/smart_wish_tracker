<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Quest</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .quest-form-container {
            background-color: #0f3460;
            border-radius: 20px;
            padding: 40px;
            width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .quest-form-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #4cc9f0;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1a1a2e;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: 2px solid #4cc9f0;
        }
        
        .conditional-fields {
            background: rgba(76, 201, 240, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-save {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-empty {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-cancel {
            background-color: #F44336;
            color: white;
        }
        
        .error-message {
            color: #f72585;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="quest-form-container">
        <h2>➕ Add New Quest</h2>
        <form id="quest-form">
            <div class="form-group">
                <label for="short-name">Short Name *</label>
                <input type="text" id="short-name" name="short_name" required>
                <div class="error-message" id="short-name-error">Short name is required</div>
            </div>
            
            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" rows="3" required></textarea>
                <div class="error-message" id="description-error">Description is required</div>
            </div>
            
            <div class="form-group">
                <label for="quest-type">Quest Type *</label>
                <select id="quest-type" name="quest_type" required>
                    <option value="">Select a quest type</option>
                    <option value="stack">Stack</option>
                    <option value="duration">Duration</option>
                    <option value="complete">Complete</option>
                </select>
                <div class="error-message" id="quest-type-error">Quest type is required</div>
            </div>
            
            <div class="conditional-fields" id="stack-fields" style="display: none;">
                <div class="form-group">
                    <label for="duration-days">Duration (days) *</label>
                    <input type="number" id="duration-days" name="duration_days" min="1" value="7">
                </div>
                
                <div class="form-group">
                    <label for="min-time">Minimum Time Per Day (minutes) *</label>
                    <input type="number" id="min-time" name="min_time" min="15" value="15" step="15">
                </div>
            </div>
            
            <div class="conditional-fields" id="duration-fields" style="display: none;">
                <div class="form-group">
                    <label for="total-hours">Total Duration (hours) *</label>
                    <input type="number" id="total-hours" name="total_hours" min="0.5" step="0.5" value="1">
                </div>
            </div>
            
            <div class="conditional-fields" id="complete-fields" style="display: none;">
                <div class="form-group">
                    <label for="result">Expected Result *</label>
                    <textarea id="result" name="result" rows="2"></textarea>
                </div>
            </div>
            
            <div class="form-group">
                <label for="reward-url">Reward URL</label>
                <input type="url" id="reward-url" name="reward_url" placeholder="https://example.com/reward">
            </div>
            
            <div class="form-group">
                <label for="reward-image">Reward Image</label>
                <input type="file" id="reward-image" name="reward_image" accept="image/*">
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn btn-empty" id="btn-empty">Empty</button>
                <div>
                    <button type="button" class="btn btn-cancel" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-save" id="btn-save">Save</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Show/hide conditional fields based on quest type
        const questTypeSelect = document.getElementById('quest-type');
        const stackFields = document.getElementById('stack-fields');
        const durationFields = document.getElementById('duration-fields');
        const completeFields = document.getElementById('complete-fields');
        
        // Submit quest function
        async function submitQuest() {
            const formData = new FormData(document.getElementById('quest-form'));
            const questData = {
                short_name: formData.get('short_name'),
                description: formData.get('description'),
                quest_type: formData.get('quest_type')
            };
            
            // Add type-specific fields
            if (questData.quest_type === 'stack') {
                questData.stack_duration_days = parseInt(formData.get('duration_days')) || 7;
                questData.stack_min_time_per_day = parseInt(formData.get('min_time')) || 15;
            } else if (questData.quest_type === 'duration') {
                questData.duration_hours = parseFloat(formData.get('total_hours')) || 1;
            } else if (questData.quest_type === 'complete') {
                questData.complete_result = formData.get('result') || '';
            }
            
            // Add reward URL if provided
            if (formData.get('reward_url')) {
                questData.reward_url = formData.get('reward_url');
            }
            
            try {
                const response = await fetch('/api/quests', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(questData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Quest saved successfully! 🎉');
                    window.location.href = '/'; // Redirect to main page
                } else {
                    alert('Error saving quest: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error submitting quest:', error);
                alert('Error submitting quest. Please try again.');
            }
        }
        
        questTypeSelect.addEventListener('change', function() {
            stackFields.style.display = 'none';
            durationFields.style.display = 'none';
            completeFields.style.display = 'none';
            
            if (this.value === 'stack') {
                stackFields.style.display = 'block';
            } else if (this.value === 'duration') {
                durationFields.style.display = 'block';
            } else if (this.value === 'complete') {
                completeFields.style.display = 'block';
            }
        });
        
        // Form validation
        const form = document.getElementById('quest-form');
        const errorMessages = document.querySelectorAll('.error-message');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            errorMessages.forEach(msg => msg.style.display = 'none');
            
            // Validate required fields
            let isValid = true;
            
            if (!document.getElementById('short-name').value) {
                document.getElementById('short-name-error').style.display = 'block';
                isValid = false;
            }
            
            if (!document.getElementById('description').value) {
                document.getElementById('description-error').style.display = 'block';
                isValid = false;
            }
            
            if (!questTypeSelect.value) {
                document.getElementById('quest-type-error').style.display = 'block';
                isValid = false;
            }
            
            // Validate conditional fields
            if (questTypeSelect.value === 'stack') {
                if (!document.getElementById('duration-days').value || 
                    !document.getElementById('min-time').value) {
                    isValid = false;
                }
            } else if (questTypeSelect.value === 'duration') {
                if (!document.getElementById('total-hours').value) {
                    isValid = false;
                }
            } else if (questTypeSelect.value === 'complete') {
                if (!document.getElementById('result').value) {
                    isValid = false;
                }
            }
            
            if (isValid) {
                // Form is valid, submit to server
                submitQuest();
            }
        });
        
        // Empty button
        document.getElementById('btn-empty').addEventListener('click', function() {
            form.reset();
            stackFields.style.display = 'none';
            durationFields.style.display = 'none';
            completeFields.style.display = 'none';
            errorMessages.forEach(msg => msg.style.display = 'none');
        });
        
        // Cancel button
        document.getElementById('btn-cancel').addEventListener('click', function() {
            if (confirm('Are you sure you want to cancel? All changes will be lost.')) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
