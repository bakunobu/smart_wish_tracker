<!DOCTYPE html>
{{ countdown_button|safe }}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub-Style Contributions Grid</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Contribution Calendar</h1>
        
        <!-- Timer Launch Section -->
        <div class="timer-launch">
            <h2>Task Timer</h2>
            <div class="task-selector">
                <label for="task-select">Select Task:</label>
                <select id="task-select">
                    <option value="">-- Select a Task --</option>
                    <!-- Tasks will be populated by JavaScript -->
                </select>
                <button id="new-task-btn">New Task</button>
            </div>
            <div class="timer-display" id="timer-display">00:00:00</div>
            <div class="timer-controls">
                <button id="start-pause-btn" class="timer-btn">Start</button>
                <button id="abort-btn" class="timer-btn">Abort</button>
                <button id="finish-btn" class="timer-btn">Finish</button>
            </div>
        </div>

        <!-- Launch History Section -->
        <div class="launch-history">
            <h2>Recent Launches</h2>
            <table id="launch-history-table">
                <thead>
                    <tr>
                        <th>Task</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
        
        <!-- Problem Adder/Selector Section -->
        <div class="problem-manager">
            <h2>Problem Selector & Adder</h2>
            <div class="problem-selector">
                <label for="project-select">Select Project:</label>
                <select id="project-select" name="project">
                    <option value="">-- Select a Project --</option>
                    <!-- Project options will be populated by JavaScript -->
                </select>
                
                <label for="event-select">Select Event:</label>
                <select id="event-select" name="event">
                    <option value="">-- Select an Event --</option>
                    <!-- Event options will be populated by JavaScript -->
                </select>
            </div>
            
            <div class="problem-adder">
                <h3>Add New Problem</h3>
                <form id="problem-form">
                    <div class="form-group">
                        <label for="new-project-name">Project Name:</label>
                        <input type="text" id="new-project-name" name="project_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="new-project-desc">Description:</label>
                        <textarea id="new-project-desc" name="description"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="new-event-topic">Event Topic:</label>
                        <input type="text" id="new-event-topic" name="event_topic" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="event-duration">Duration (minutes):</label>
                        <input type="number" id="event-duration" name="duration" value="15" min="1" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Add Problem</button>
                </form>
            </div>
        </div>
        
        <!-- Calendar Section -->
        <div class="calendar-container">
            <!-- Day of week labels (vertical) -->
            <div class="day-labels">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>
            
            <!-- Main grid container -->
            <div class="grid-container">
                <!-- Week labels (horizontal) -->
                <div class="week-labels" id="week-labels">
                    <!-- Will be generated by JavaScript -->
                </div>
                
                <!-- Contribution grid -->
                <div class="contribution-grid" id="grid">
                    <!-- Will be generated by JavaScript -->
                </div>
            </div>
        </div>
        
        <div class="legend">
            <span>Less</span>
            <div class="legend-colors">
                <div class="color-level" style="background-color: #ebedf0;"></div>
                <div class="color-level" style="background-color: #c6e48b;"></div>
                <div class="color-level" style="background-color: #7bc96f;"></div>
                <div class="color-level" style="background-color: #239a3b;"></div>
                <div class="color-level" style="background-color: #196127;"></div>
            </div>
            <span>More</span>
        </div>
    </div>
    
    <script>
        // Pass the contribution data from Flask to JavaScript
        const contributions = {{ contributions|tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
