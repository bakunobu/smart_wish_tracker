<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub-Style Contributions Grid</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Contribution Calendar</h1>
        <div class="contribution-grid" id="grid">
            <!-- Grid will be generated by JavaScript -->
        </div>
        <div class="legend">
            <span>Less</span>
            <div class="legend-colors">
                <div class="color-level" style="background-color: #ebedf0;"></div>
                <div class="color-level" style="background-color: #c6e48b;"></div>
                <div class="color-level" style="background-color: #7bc96f;"></div>
                <div class="color-level" style="background-color: #239a3b;"></div>
                <div class="color-level" style="background-color: #196127;"></div>
            </div>
            <span>More</span>
        </div>
    </div>
    <script>
        // Pass the contribution data from Flask to JavaScript
        const contributions = {{ contributions|tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
